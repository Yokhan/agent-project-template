name: Release Template

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v3.8.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Validate And Publish Release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $tag"; exit 1; }
          tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          [ "$head_commit" = "$tag_commit" ] || { echo "Checked out $head_commit but tag points to $tag_commit"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Validate release gate
        run: |
          bash scripts/validate-template.sh
          bash scripts/check-drift.sh
          bash scripts/test-hooks.sh
          bash scripts/test-template.sh
          bash scripts/sync-agents.sh
          node scripts/test-codex-routing.js
          node scripts/validate-codex-skills.js
          node scripts/validate-codex-agents.js

      - name: Build release archive
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          tag="$RELEASE_TAG"
          archive="agent-project-template-${tag}.tar.gz"
          git archive --format=tar.gz --prefix="agent-project-template-${tag}/" -o "$archive" "$RELEASE_COMMIT"
          {
            echo "# Agent Project Template ${tag}"
            echo ""
            echo "Update downstream projects with:"
            echo ""
            echo '```bash'
            echo "bash scripts/sync-template.sh --from-git --ref ${tag} --dry-run"
            echo "bash scripts/sync-template.sh --from-git --ref ${tag}"
            echo '```'
            echo ""
            echo "AgentOS may orchestrate rollout order, but projects consume this template through the same sync command."
          } > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          tag="$RELEASE_TAG"
          archive="agent-project-template-${tag}.tar.gz"
          current_tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          [ "$current_tag_commit" = "$RELEASE_COMMIT" ] || { echo "Tag moved from $RELEASE_COMMIT to $current_tag_commit"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace a published asset."
            exit 1
          else
            gh release create "$tag" "$archive" --title "Agent Project Template ${tag}" --notes-file release-notes.md
          fi
