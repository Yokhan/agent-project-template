name: Release Template

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v4.9.4"
        required: true
        type: string

permissions: {}

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $tag"; exit 1; }
          tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          [ "$head_commit" = "$tag_commit" ] || { echo "Checked out $head_commit but tag points to $tag_commit"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Validate release gate
        env:
          EXPECTED_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          bash scripts/validate-template.sh
          bash scripts/check-drift.sh
          bash scripts/test-hooks.sh
          bash scripts/test-template.sh
          bash scripts/sync-agents.sh
          node scripts/test-codex-routing.js
          node scripts/validate-codex-skills.js
          node scripts/validate-codex-agents.js
          node scripts/test-writing-references.js
          node scripts/validate-writing-references.js
          node scripts/test-writing-intent.js
          node scripts/test-codex-mcp-config.js
          node scripts/configure-codex-mcp.js --check
          npm --prefix mcp-servers/context-router ci
          npm --prefix mcp-servers/context-router test
          npm --prefix mcp-servers/context-router run build

      - name: Install and health-check release toolchain
        timeout-minutes: 25
        run: |
          bash scripts/bootstrap-mcp.sh --install --tool-profile=full
          bash scripts/bootstrap-mcp.sh --check --tool-profile=full

      - name: Verify release config with Codex 0.125.0
        run: |
          npm install --global @openai/codex@0.125.0
          node -e 'const fs=require("fs"),os=require("os"),path=require("path"); const root=fs.realpathSync(process.cwd()); const key=process.platform==="win32"?root.toLowerCase():root; const home=process.env.CODEX_HOME||path.join(os.homedir(),".codex"); fs.mkdirSync(home,{recursive:true}); fs.appendFileSync(path.join(home,"config.toml"),`\n[projects.${JSON.stringify(key)}]\ntrust_level = "trusted"\n`);'
          codex mcp list | tee codex-mcp-list.txt
          grep -q 'context-router' codex-mcp-list.txt
          grep -q 'engram' codex-mcp-list.txt
          grep -q 'codebase-memory-mcp' codex-mcp-list.txt

  package:
    name: Package Verified Tag
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.bundle.outputs.archive }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Build immutable release bundle
        id: bundle
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          tag="$RELEASE_TAG"
          archive="agent-project-template-${tag}.tar.gz"
          tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          [ "$tag_commit" = "$RELEASE_COMMIT" ] || { echo "Tag moved from $RELEASE_COMMIT to $tag_commit"; exit 1; }
          [ "$head_commit" = "$RELEASE_COMMIT" ] || { echo "Package checkout $head_commit does not match $RELEASE_COMMIT"; exit 1; }
          git archive --format=tar.gz --prefix="agent-project-template-${tag}/" -o "$archive" "$RELEASE_COMMIT"
          sha256sum "$archive" > SHA256SUMS
          node -e 'const fs=require("fs"); const [tag,commit,archive]=process.argv.slice(1); const sha=fs.readFileSync("SHA256SUMS","utf8").trim().split(/\s+/)[0]; fs.writeFileSync("release-metadata.json",JSON.stringify({tag,commit,archive,sha256:sha},null,2)+"\n");' "$tag" "$RELEASE_COMMIT" "$archive"
          {
            echo "# Agent Project Template ${tag}"
            echo ""
            echo "Update downstream projects with:"
            echo ""
            echo '~~~bash'
            echo "bash scripts/sync-template.sh --from-git --ref ${tag} --dry-run"
            echo "bash scripts/sync-template.sh --from-git --ref ${tag}"
            echo '~~~'
            echo ""
            echo "AgentOS may orchestrate rollout order, but projects consume this template through the same pinned sync contract."
          } > release-notes.md
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle-${{ needs.validate.outputs.tag }}
          path: |
            ${{ steps.bundle.outputs.archive }}
            SHA256SUMS
            release-metadata.json
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Verified Bundle
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle-${{ needs.validate.outputs.tag }}

      - name: Verify bundle and remote tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_ARCHIVE: ${{ needs.package.outputs.archive }}
        run: |
          sha256sum -c SHA256SUMS
          node -e 'const fs=require("fs"); const [tag,commit,archive]=process.argv.slice(1); const m=JSON.parse(fs.readFileSync("release-metadata.json","utf8")); if(m.tag!==tag||m.commit!==commit||m.archive!==archive)throw new Error("Release metadata mismatch");' "$RELEASE_TAG" "$RELEASE_COMMIT" "$RELEASE_ARCHIVE"
          remote_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          [ "$remote_commit" = "$RELEASE_COMMIT" ] || { echo "Remote tag resolves to $remote_commit, expected $RELEASE_COMMIT"; exit 1; }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_ARCHIVE: ${{ needs.package.outputs.archive }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace a published asset."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" SHA256SUMS release-metadata.json \
            --verify-tag \
            --title "Agent Project Template ${RELEASE_TAG}" \
            --notes-file release-notes.md
